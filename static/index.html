<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Insights</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{--ink:#15211d;--muted:#71817b;--line:#e8eeeb;--mint:#1f9d74;--soft:#f4f8f5}*{box-sizing:border-box}body{margin:0;background:#fbfcfb;color:var(--ink);font:14px 'DM Sans',sans-serif}.shell{display:flex;min-height:100vh}.side{width:250px;background:var(--soft);border-right:1px solid #e7eee9;padding:28px 18px;position:fixed;inset:0 auto 0 0}.brand{font:700 21px 'Space Grotesk';display:flex;align-items:center;gap:10px;margin:0 8px 38px}.mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#1f9d74,#48c68e)}.label{color:#98a6a0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 10px 8px}.nav{display:block;width:100%;border:0;background:transparent;color:#74827d;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600;margin:3px 0;cursor:pointer}.nav:hover,.nav.active{background:#dff3e8;color:#167653}.demo{position:absolute;left:18px;right:18px;bottom:28px;padding:14px;background:#e9f6ef;border-radius:12px;color:#176d4c;font-size:12px;font-weight:700}.demo small{display:block;color:#5f8975;font-weight:400;margin-top:5px}.main{margin-left:250px;padding:44px 6vw 70px;width:calc(100% - 250px);max-width:1600px}.eyebrow{color:var(--mint);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}h1{font:700 34px 'Space Grotesk';letter-spacing:-.04em;margin:0 0 7px}h2{font:700 16px 'Space Grotesk';margin:0}.subtle,.caption{color:var(--muted)}.caption{font-size:12px;margin-top:4px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:30px 0 24px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 14px #1d453308}.metric{color:var(--muted);font-size:13px;font-weight:600}.value{font:700 29px 'Space Grotesk';margin-top:9px}.delta{color:#16815c;font-size:12px;margin-left:7px}.twocol{display:grid;grid-template-columns:1fr 1.35fr;gap:24px}.donutrow{display:flex;align-items:center;gap:24px;margin-top:18px}.donut{width:142px;height:142px;border-radius:50%;background:conic-gradient(#3dbb87 0 68.5%,#bed8cb 68.5% 89.5%,#f2a65a 89.5% 100%);position:relative;flex:none}.donut:after{content:'';position:absolute;inset:25px;background:#fff;border-radius:50%}.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font:700 24px 'Space Grotesk'}.legend{min-width:160px;display:flex;justify-content:space-between;margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.chart{height:174px;display:flex;align-items:end;gap:24px;padding:18px 10px 26px;border-bottom:1px solid #eef2ef}.bar{flex:1;background:#3dbb87;border-radius:5px 5px 0 0;min-height:18px;position:relative}.bar:after{content:attr(data-label);position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.video{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid #eef2ef}.video:last-child{border:0}.thumb{width:78px;height:48px;object-fit:cover;border-radius:8px}.video b{font-size:13px;display:block;margin-bottom:4px}.video small{color:var(--muted)}.pill{margin-left:auto;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:700;background:#e3f7ed;color:#19825d}.pill.processing{background:#edf1f0;color:#74827d}.big{font:700 42px 'Space Grotesk';margin-top:20px}.progress{height:8px;background:#e7f5ed;border-radius:99px;margin:14px 0}.progress i{display:block;height:100%;width:82%;border-radius:99px;background:#3dbb87}.toolbar{display:flex;gap:12px;margin:25px 0 10px}.toolbar input,.toolbar select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}.toolbar input{flex:1}.primary,.secondary{border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{border:0;background:#1f9d74;color:#fff}.secondary{border:1px solid var(--line);background:#fff}.table{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 100px 100px 100px 90px;align-items:center;gap:15px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.row img{width:80px;height:48px;border-radius:8px;object-fit:cover;float:left;margin-right:13px}.row strong{display:block;padding-top:4px}.row small{color:var(--muted)}.form{max-width:720px;margin-top:25px}.form textarea{display:block;width:100%;height:150px;margin:18px 0;resize:vertical}.topic{display:inline-block;background:#f0f7f3;color:#438067;border-radius:8px;padding:7px 10px;margin:15px 5px 0 0;font-size:12px;font-weight:600}.comment{padding:12px 0;border-bottom:1px solid var(--line)}.comment small{display:block;color:#19825d;text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.08em;margin-bottom:4px}@media(max-width:900px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px);padding:32px 25px}.grid4{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.row{grid-template-columns:1fr 80px 80px}.hide{display:none}}@media(max-width:620px){.side{position:static;width:100%;height:auto}.demo{position:static;margin-top:25px}.shell{display:block}.main{margin:0;width:100%;padding:30px 18px}.grid4{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 80px}.hide{display:none}}
    .main{max-width:none;padding-left:clamp(28px,4vw,72px);padding-right:clamp(28px,4vw,72px)}
    .trend-svg{display:block;width:100%;height:220px;margin-top:12px;overflow:visible}.trend-svg text{font:11px 'DM Sans',sans-serif;fill:#71817b}.trend-svg .grid{stroke:#e8eeeb;stroke-width:1}.trend-svg .line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.trend-svg .point{stroke:#fff;stroke-width:2}
  </style>
</head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="mark">◒</span>Creator Insights</div><div class="label">Workspace</div><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="videos">My Videos</button><button class="nav" data-page="analysis">Sentiment Analysis</button><div class="label" style="margin-top:24px">Manage</div><button class="nav" data-page="add">Add Videos</button><button class="nav" data-page="settings">Settings</button><div class="demo">Demo workspace<small>Mock data is enabled while the analysis API is being built.</small></div></aside><main class="main" id="app"></main></div>
<script>
let data,selected='v1';const app=document.querySelector('#app'),fmt=n=>n.toLocaleString();
const header=(a,b)=>`<div class="eyebrow">Creator dashboard</div><h1>${a}</h1><div class="subtle">${b}</div>`;
const row=v=>`<div class="video"><img class="thumb" src="${v.thumbnail}"><div><b>${v.title}</b><small>${fmt(v.comments)} comments · ${v.analyzed}</small></div><span class="pill ${v.status==='Completed'?'':'processing'}">${v.status==='Completed'?v.positive+'% positive':'In progress'}</span></div>`;
function overview(){const d=data;app.innerHTML=header('Understand your audience.','Improve your content with sentiment insights from every comment.')+`<div class="grid4"><div class="card"><div class="metric">Videos analyzed</div><div class="value">${d.video_count}</div></div><div class="card"><div class="metric">Comments analyzed</div><div class="value">${fmt(d.comments)}</div></div><div class="card"><div class="metric">Positive sentiment</div><div class="value">${d.positive}%</div></div><div class="card"><div class="metric">Positive sentiment change</div><div class="value">+8.2%<span class="delta">↑ this month</span></div></div></div><div class="twocol"><div class="panel"><h2>Overall audience sentiment</h2><div class="caption">Across all submitted videos</div><div class="donutrow"><div class="donut"><b>68.5%</b></div><div><div class="legend"><span><i class="dot" style="background:#3dbb87"></i>Positive</span><b>68.5%</b></div><div class="legend"><span><i class="dot" style="background:#bed8cb"></i>Neutral</span><b>21.0%</b></div><div class="legend"><span><i class="dot" style="background:#f2a65a"></i>Negative</span><b>10.5%</b></div></div></div></div><div class="panel"><h2>Sentiment trends</h2><div class="caption">Weekly percentage of audience reactions</div><div class="chart">${d.trend.positive.map((n,i)=>`<i class="bar" style="height:${n*1.9}px" data-label="${d.trend.labels[i]}"></i>`).join('')}</div></div></div><div class="twocol" style="margin-top:24px"><div class="panel"><h2>Video performance</h2><div class="caption">Find the content your audience reacts to most</div>${d.videos.slice(0,3).map(row).join('')}</div><div class="panel"><h2>Quick insight</h2><div class="caption">Based on your latest analysis</div><div class="big">82%</div><div class="subtle">Your AI explainer has the strongest positive response.</div><div class="progress"><i></i></div><div class="subtle">Consider making more videos with clear examples and practical demos.</div></div></div>`}
function videos(){app.innerHTML=header('My videos','Manage your submitted videos and review their audience response.')+`<div class="toolbar"><input id="search" placeholder="Search by title..." oninput="renderVideos()"><select id="filter" onchange="renderVideos()"><option>All videos</option><option>Completed</option><option>Processing</option></select></div><div class="subtle" id="count"></div><div class="table" id="video-list"></div>`;renderVideos()}
function renderVideos(){const q=(document.querySelector('#search')?.value||'').toLowerCase(),f=document.querySelector('#filter')?.value||'All videos',list=data.videos.filter(v=>v.title.toLowerCase().includes(q)&&(f==='All videos'||v.status===f));document.querySelector('#count').textContent=`${list.length} videos`;document.querySelector('#video-list').innerHTML=list.map(v=>`<div class="row"><div><img src="${v.thumbnail}"><strong>${v.title}</strong><small>${fmt(v.comments)} comments · ${v.analyzed}</small></div><div><small>Positive</small><br><b>${v.positive}%</b></div><div class="hide"><small>Negative</small><br><b>${v.negative}%</b></div><div class="hide"><span class="pill ${v.status==='Completed'?'':'processing'}">${v.status}</span></div><button class="secondary" onclick="openAnalysis('${v.id}')">View</button></div>`).join('')}
function openAnalysis(id){selected=id;document.querySelector('[data-page="analysis"]').click()}
function analysis(){const v=data.videos.find(x=>x.id===selected)||data.videos[0];app.innerHTML=header('Sentiment analysis',v.title)+`<div class="twocol" style="margin-top:25px"><div class="panel"><img style="width:100%;height:230px;object-fit:cover;border-radius:10px" src="${v.thumbnail}"><div class="big">${fmt(v.comments)}</div><div class="caption">Comments analyzed · ${v.analyzed}</div></div><div class="panel"><div class="metric">Positive sentiment</div><div class="big">${v.positive}%</div><div style="color:#19825d;font-weight:700">Healthy audience response</div><h2 style="margin-top:32px">Most discussed topics</h2><div>${v.topics.map(t=>`<span class="topic">${t}</span>`).join('')}</div><div class="comments"><h2>Audience comments</h2><div class="comment"><small>Positive</small>“The explanation was really clear. I finally understand the basics.”</div><div class="comment"><small>Neutral</small>“Would love to see a follow-up with a real project.”</div><div class="comment"><small style="color:#d8782e">Negative</small>“The audio gets a little difficult to hear near the end.”</div></div></div></div>`}
function add(){app.innerHTML=header('Add YouTube videos','Submit links and we’ll prepare them for comment analysis.')+`<div class="panel form"><h2>YouTube video URLs</h2><div class="caption">One URL per line. We’ll validate links and ignore duplicates.</div><textarea id="urls" placeholder="https://youtube.com/watch?v=video_id_1\nhttps://youtube.com/watch?v=video_id_2"></textarea><div id="valid" class="caption">0 submitted · 0 valid links</div><button class="primary" style="margin-top:15px" onclick="submitVideos()">Start analysis</button></div>`;document.querySelector('#urls').oninput=()=>{const a=document.querySelector('#urls').value.split(/\n/).filter(Boolean),v=a.filter(x=>x.includes('youtube.com')||x.includes('youtu.be'));document.querySelector('#valid').textContent=`${a.length} submitted · ${v.length} valid links`}}
async function submitVideos(){const urls=document.querySelector('#urls').value.split(/\n/).map(x=>x.trim()).filter(Boolean),r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})}),out=await r.json();await load();alert(`${out.added} video(s) queued for analysis.`);add()}
function settings(){app.innerHTML=header('Settings','Choose how Creator Insights should collect and present feedback.')+`<div class="panel form"><h2>Analysis preferences</h2><p><label><input type="checkbox" checked> Include neutral comments in reports</label></p><p><label><input type="checkbox" checked> Show representative comments</label></p><label class="caption">Default date range</label><select><option>Last 30 days</option><option>Last 90 days</option><option>All time</option></select></div>`}
function drawTrendLines(){const c=document.querySelector('.chart');if(!c||c.querySelector('svg'))return;const s=[data.trend.positive,data.trend.neutral,data.trend.negative],colors=['#3dbb87','#9fc8b6','#f2a65a'],x=i=>24+i*70,y=v=>176-v*1.55,lines=s.map((a,j)=>`<polyline class="line" stroke="${colors[j]}" points="${a.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"></polyline><g>${a.map((v,i)=>`<circle class="point" fill="${colors[j]}" cx="${x(i)}" cy="${y(v)}" r="4"></circle>`).join('')}</g>`).join(''),labels=data.trend.labels.map((l,i)=>`<text x="${x(i)}" y="210" text-anchor="middle">${l}</text>`).join(''),grid=[25,75,125,175].map(v=>`<line class="grid" x1="0" x2="444" y1="${v}" y2="${v}"></line>`).join('');c.innerHTML=`<svg class="trend-svg" viewBox="0 0 444 220" preserveAspectRatio="none">${grid}${lines}${labels}</svg>`}
async function load(){data=await(await fetch('/api/dashboard')).json();overview();drawTrendLines()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');({overview,videos,analysis,add,settings}[n.dataset.page])();if(n.dataset.page==='overview')drawTrendLines()});load();
</script></body></html>
